<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<title>Physics interactive simulations</title>
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<meta content="" name="keywords">
	<meta content="" name="description">

	<!-- Favicons -->
	<link href="files/favicon.png" rel="icon">
	<link href="files/apple-touch-icon.png" rel="apple-touch-icon">

	<link rel="stylesheet" type="text/css" href="./css/index.css">
	<script async="" src="https://www.googletagmanager.com/gtag/js?id=G-7VWWT4ZKR6"></script>
	<script>
		window.dataLayer = window.dataLayer || [];
		function gtag() { dataLayer.push(arguments); }
		gtag('js', new Date());

		gtag('config', 'G-7VWWT4ZKR6');
	</script>
	<meta name="google-site-verification" content="mz0TRB59UNqdTxhwzmXmGdgVPh8pB4YqjuUr-aWNGIY">
	<style>
		button {
			color: rgba(253, 251, 251, 0.75);
			background: rgb(3, 108, 156);
			outline: 1px solid rgba(131, 10, 36, 0.75);
			border: 10px;
			margin: 5px;
			border-radius: 5px;
			padding: 5px 10px;
			cursor: pointer;
		}
	</style>
</head>

<body>

	<div id="panel">

		<div id="header">
			<h1><a href="index.html"> EFFECTUALL<sup>3D</sup> PHYSICS</a></h1>

			<div id="sections">
				<a href="./Theory/index.html">Theory</a>
				<span class="selected">Sims</span>
			</div>

			<div id="expandButton"></div>
		</div>

		<div id="panelScrim"></div>

		<div id="contentWrapper">

			<div id="inputWrapper">
				<input placeholder="" type="text" id="filterInput" autocorrect="off" autocapitalize="off"
					spellcheck="false" />
				<div id="exitSearchButton"></div>
			</div>
			<div id="greet"></div>
			<button type="button" id="signout">Sign Out</button>
			<div id="content">
				<img id="previewsToggler" src="./files/thumbnails.svg" width="20" height="20" />
			</div>
		</div>


	</div>

	<iframe id="viewer" name="viewer" allow="fullscreen; xr-spatial-tracking;"
		src="./Simulations/Optics_Compound_Microscope.html"></iframe>
	<a id="button" target="_blank"><img src="../files/ic_code_black_24dp.svg"></a>

	<script>
		let UserCreds = JSON.parse(sessionStorage.getItem("user-creds"));
		let UserInfo = JSON.parse(sessionStorage.getItem("user-info"))

		// let MsgHead = document.getElementById('msg')
		let GreetHead = document.getElementById('greet')
		let SignoutBtn = document.getElementById('signout')



		let SignOut = () => {
			sessionStorage.removeItem("user-creds");
			sessionStorage.removeItem("user-info");
			window.location.href = 'index.html'
		}

		let CheckCred = () => {
			// console.log(sessionStorage)
			if (!sessionStorage.getItem("user-creds")) {
				console.log(sessionStorage)
				window.location.href = 'login.html'
			} else {
				// console.log(sessionStorage)
				GreetHead.innerText = `Welcome "${UserInfo.firstname + " " + UserInfo.lastname}"!`;
			}
		}

		window.addEventListener('load', CheckCred)
		SignoutBtn.addEventListener('click', SignOut)
	</script>
	<script src="script.js"></script>

</body>

</html>
