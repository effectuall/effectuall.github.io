<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EffectualL - Wave Learning Module</title>
    <!-- Load D3.js for the Knowledge Graph -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <style>
        :root {
            --dark-blue: #012c59;
            --orange: #fc5206;
            --cyan: #0dcfb2;
            --cyan-dark: #0490a1;
            --orange-light: #faa630;
            --white: #ffffff;
            --bg: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--dark-blue);
            line-height: 1.6;
            overflow-x: hidden;
        }

        header {
            background-color: var(--dark-blue);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .logo-container { display: flex; align-items: center; gap: 12px; }
        .logo-box {
            background-color: var(--cyan);
            color: white;
            font-weight: 800;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 1.2rem;
        }
        .logo-text { color: white; font-size: 1.3rem; font-weight: 600; }

        .tabs {
            background: white;
            display: flex;
            justify-content: center;
            gap: 1rem;
            padding: 0.5rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .tab-btn {
            padding: 10px 20px;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: 600;
            color: #64748b;
            border-radius: 8px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn.active { color: var(--orange); background: #fff7ed; }

        main { padding: 2rem; max-width: 1200px; margin: 0 auto; }
        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

                .card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
            border-top: 5px solid var(--cyan);
            position: relative;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .external-link {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--cyan-dark);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .external-link:hover {
            background: #f0fdfa;
        }

        .iframe-container {
            position: relative;
            width: 100%;
            height: 600px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--cyan);
        }

        iframe { width: 100%; height: 100%; border: none; }


        /* Graph Styles */
        #graph-container { position: relative; }
        #graph-svg {
            width: 100%;
            height: 500px;
            background: #fafafa;
            border-radius: 12px;
            cursor: grab;
        }

        .node circle { stroke: #fff; stroke-width: 2px; transition: stroke-width 0.2s; }
        .node:hover circle { stroke-width: 4px; stroke: var(--orange-light); }
        .node text { font-size: 12px; font-weight: 600; pointer-events: none; fill: var(--dark-blue); }
        .link { stroke: #cbd5e1; stroke-opacity: 0.6; stroke-width: 2px; }

        /* Annotation Tooltip */
        .tooltip {
            position: absolute;
            background: rgba(1, 44, 89, 0.95);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 13px;
            pointer-events: none;
            display: none;
            max-width: 250px;
            z-index: 2000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            line-height: 1.4;
        }

        /* Flashcards */
        .flashcard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .flashcard { height: 200px; perspective: 1000px; cursor: pointer; }
        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .flashcard-front { background: var(--cyan); color: white; font-weight: 600; }
        .flashcard-back { background: var(--orange); color: white; transform: rotateY(180deg); }

        /* Quiz */
        .quiz-container { max-width: 700px; margin: 0 auto; }
        .option-btn {
            display: block; width: 100%; padding: 15px; background: #f8fafc;
            border: 2px solid #e2e8f0; border-radius: 10px; cursor: pointer;
            text-align: left; transition: all 0.2s; margin-bottom: 10px;
        }
        .option-btn:hover { border-color: var(--cyan); background: #f0fdfa; }
        .option-btn.correct { background: #dcfce7; border-color: #22c55e; color: #166534; }
        .option-btn.wrong { background: #fee2e2; border-color: #ef4444; color: #991b1b; }
        .feedback { margin-top: 1.5rem; padding: 1rem; border-radius: 8px; display: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-box">EL</div>
            <span class="logo-text">EffectualL</span>
        </div>
    </header>

    <nav class="tabs">
        <button class="tab-btn" onclick="showTab('2dmod', this)"> 2DSIM</button>
        <button class="tab-btn active" onclick="showTab('3dmod', this)"> 3DSIM</button>
        <button class="tab-btn" onclick="showTab('graph', this)"><span>🕸️</span> Knowledge Graph</button>
        <button class="tab-btn" onclick="showTab('flashcards', this)"><span>📇</span> Flashcards</button>
        <button class="tab-btn" onclick="showTab('quiz', this)"><span>📝</span> Quiz</button>
    </nav>

    <main>
        <!-- 3D Simulation Tab -->
        <section id="3dmod" class="tab-content active">
            <div class="card">
                <div class="card-header">
                    <h2>Interactive 3D Wave Module</h2>
                    <a href="https://effectuall.github.io/Simulations/Optics_Understanding_Waves" target="_blank" class="external-link">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                        Full Screen
                    </a>
                </div>
                <div class="iframe-container">
                    <iframe src="https://effectuall.github.io/Simulations/Optics_Understanding_Waves" title="EffectualL Wave Simulation"></iframe>
                </div>
            </div>
        </section>
        
        <!-- 2D Simulation Tab -->
          <section id="2dmod" class="tab-content ">
            <div class="card">
                <div class="card-header">
                    <h2>Interactive 2D Wave Module</h2>
                    <a href="https://effectuall.github.io/Simulations/Games/InteractiveWave" target="_blank" class="external-link">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                        Full Screen
                    </a>
                </div>
                <div class="iframe-container">
                    <iframe src="https://effectuall.github.io/Simulations/Games/InteractiveWave" title="EffectualL Wave Simulation"></iframe>
                </div>
            </div>
        </section>
        
        <!-- Knowledge Graph Tab -->
        <section id="graph" class="tab-content">
            <div class="card">
                <h2 style="margin-bottom: 10px;">Core Concept Connectivity</h2>
                <p style="color: #64748b; margin-bottom: 20px;">Hover or click nodes for detailed descriptions.</p>
                <div id="graph-container">
                    <svg id="graph-svg"></svg>
                    <div id="tooltip" class="tooltip"></div>
                </div>
            </div>
        </section>

        <!-- Flashcards Tab -->
        <section id="flashcards" class="tab-content">
            <div class="card">
                <h2 style="margin-bottom: 20px;">Flashcard Study Set</h2>
                <div class="flashcard-grid" id="flashcard-container"></div>
            </div>
        </section>

        <!-- Quiz Tab -->
        <section id="quiz" class="tab-content">
            <div class="card">
                <div class="quiz-container">
                    <h2 style="margin-bottom: 10px;">Wave Mastery Quiz</h2>
                    <div id="quiz-body"></div>
                    <div id="quiz-feedback" class="feedback"></div>
                </div>
            </div>
        </section>
    </main>

    <script>
        // Data Structure with Descriptions for Annotations
        const nodes = [
            { id: 'Waves', group: 1, desc: 'A periodic disturbance of a medium that transfers energy without transferring matter.' },
            { id: 'Transverse', group: 2, desc: 'Particles of the medium oscillate about fixed positions at right angles to the direction of wave travel.' },
            { id: 'Longitudinal', group: 2, desc: 'Particles of the medium oscillate about fixed positions along the same line as the wave energy travels.' },
            { id: 'Oscillation', group: 3, desc: 'Back and forth motion about a fixed equilibrium position.' },
            { id: 'Frequency (Hz)', group: 4, desc: 'The number of waves per second passing through a given point. Measured in Hertz.' },
            { id: 'Wavelength (λ)', group: 4, desc: 'The distance between the same point on two adjacent disturbances (e.g. crest to crest).' },
            { id: 'Amplitude', group: 4, desc: 'The maximum distance between a crest or trough and the undisturbed position.' },
            { id: 'Wave Speed (v)', group: 4, desc: 'The distance travelled by a wave crest or compression in one second (v = f × λ).' },
            { id: 'Crests & Troughs', group: 5, desc: 'Crests are peaks of maximum positive displacement; Troughs are points of maximum negative displacement.' },
            { id: 'Compression', group: 5, desc: 'A region in a longitudinal wave where the particles are closest together.' },
            { id: 'Rarefaction', group: 5, desc: 'A region in a longitudinal wave where the particles are furthest apart.' }
        ];

        const links = [
            { source: 'Waves', target: 'Transverse', value: 1 },
            { source: 'Waves', target: 'Longitudinal', value: 1 },
            { source: 'Transverse', target: 'Oscillation', value: 1 },
            { source: 'Longitudinal', target: 'Oscillation', value: 1 },
            { source: 'Waves', target: 'Frequency (Hz)', value: 1 },
            { source: 'Waves', target: 'Wavelength (λ)', value: 1 },
            { source: 'Waves', target: 'Amplitude', value: 1 },
            { source: 'Waves', target: 'Wave Speed (v)', value: 1 },
            { source: 'Transverse', target: 'Crests & Troughs', value: 1 },
            { source: 'Longitudinal', target: 'Compression', value: 1 },
            { source: 'Longitudinal', target: 'Rarefaction', value: 1 },
            { source: 'Wave Speed (v)', target: 'Frequency (Hz)', value: 1 },
            { source: 'Wave Speed (v)', target: 'Wavelength (λ)', value: 1 }
        ];

        function showTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
            
            if(tabId === 'graph') {
                initD3Graph();
            }
        }

        let graphInitialized = false;
        function initD3Graph() {
            if (graphInitialized) return;
            graphInitialized = true;

            const svg = d3.select("#graph-svg");
            const tooltip = d3.select("#tooltip");
            const container = document.getElementById('graph-container');
            const width = container.clientWidth;
            const height = 500;

            const simulation = d3.forceSimulation(nodes)
                .force("link", d3.forceLink(links).id(d => d.id).distance(110))
                .force("charge", d3.forceManyBody().strength(-400))
                .force("center", d3.forceCenter(width / 2, height / 2));

            const link = svg.append("g")
                .selectAll("line")
                .data(links)
                .enter().append("line")
                .attr("class", "link");

            const node = svg.append("g")
                .selectAll("g")
                .data(nodes)
                .enter().append("g")
                .attr("class", "node")
                .call(d3.drag()
                    .on("start", dragstarted)
                    .on("drag", dragged)
                    .on("end", dragended))
                .on("mouseover", (event, d) => {
                    tooltip.style("display", "block")
                           .html(`<strong>${d.id}</strong><br/>${d.desc}`);
                })
                .on("mousemove", (event) => {
                    const rect = container.getBoundingClientRect();
                    tooltip.style("left", (event.clientX - rect.left + 15) + "px")
                           .style("top", (event.clientY - rect.top + 15) + "px");
                })
                .on("mouseout", () => {
                    tooltip.style("display", "none");
                });

            node.append("circle")
                .attr("r", d => d.group === 1 ? 28 : 20)
                .attr("fill", d => {
                    if (d.group === 1) return "#012c59";
                    if (d.group === 2) return "#0dcfb2";
                    if (d.group === 4) return "#fc5206";
                    return "#faa630";
                });

            node.append("text")
                .attr("dy", 38)
                .attr("text-anchor", "middle")
                .text(d => d.id);

            simulation.on("tick", () => {
                link
                    .attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);

                node.attr("transform", d => `translate(${d.x},${d.y})`);
            });

            function dragstarted(event, d) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x; d.fy = d.y;
            }
            function dragged(event, d) {
                d.fx = event.x; d.fy = event.y;
            }
            function dragended(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                d.fx = null; d.fy = null;
            }
        }

        const flashcardData = [
            { q: "What is a Wave?", a: "A periodic disturbance of a medium that transfers energy without transferring matter." },
            { q: "Transverse Wave", a: "Particles oscillate at right angles (perpendicular) to the direction of wave travel." },
            { q: "Longitudinal Wave", a: "Particles oscillate along the same line (parallel) as the wave travels." },
            { q: "Wave Speed (v)", a: "The speed calculated by: Frequency (f) × Wavelength (λ)." }
        ];

        function initFlashcards() {
            const container = document.getElementById('flashcard-container');
            flashcardData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'flashcard';
                card.innerHTML = `<div class="flashcard-inner"><div class="flashcard-front">${item.q}</div><div class="flashcard-back">${item.a}</div></div>`;
                card.onclick = () => card.classList.toggle('flipped');
                container.appendChild(card);
            });
        }

        const questions = [
            { q: "Frequency is measured in what unit?", opts: ["Metres", "Hertz (Hz)", "Seconds", "Joules"], correct: 1 },
            { q: "In a longitudinal wave, oscillation is ___ to wave travel.", opts: ["Perpendicular", "At 45 degrees", "Parallel", "Circular"], correct: 2 }
        ];
        let curQ = 0;

        function renderQuiz() {
            const body = document.getElementById('quiz-body');
            if(!body) return;
            const q = questions[curQ];
            body.innerHTML = `<p class="question">${q.q}</p><div class="options">${q.opts.map((o,i) => `<button class="option-btn" onclick="checkQ(${i})">${o}</button>`).join('')}</div>`;
        }

        function checkQ(idx) {
            const fb = document.getElementById('quiz-feedback');
            fb.style.display = 'block';
            if(idx === questions[curQ].correct) {
                fb.innerHTML = "Correct!"; fb.style.background = "#dcfce7";
            } else {
                fb.innerHTML = "Incorrect. Try studying the Knowledge Graph."; fb.style.background = "#fee2e2";
            }
            setTimeout(() => { curQ = (curQ + 1) % questions.length; renderQuiz(); fb.style.display='none'; }, 2000);
        }

        window.onload = () => { initFlashcards(); renderQuiz(); };
    </script>
</body>

</html>
